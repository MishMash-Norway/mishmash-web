schema_version: 1
purpose: >-
  Machine-readable handover for adding or updating MishMash website content.
  Use this file to choose the correct source file, fields, automation, and checks
  before editing. The repository wiki remains the detailed human guide.

writing_style:
  purpose: >-
    House style for AI-assisted copy about MishMash, its partners, research,
    people, news, and events in Norway.
  hard_rules:
    spelling: British English
    forbidden:
      - em_dash (Unicode U+2014)
      - inline_bold_markdown (double asterisks used for emphasis)
    sentence_length:
      preferred_max_words: 25
      exception: A longer sentence is acceptable when splitting it would reduce clarity.
  language:
    voice: active
    tone: clear, informed, specific, and welcoming
    audiences:
      - Researchers from all disciplines
      - Artists and creative practitioners
      - Public sector partners
      - Private sector partners
      - Students and educators
      - The general public
    default_audience: An interested reader who may not know the field or its terminology.
    explanation_strategy:
      principle: Start general, then add technical or discipline-specific detail.
      sequence:
        - State what the work, event, or news is about in everyday language.
        - Explain why it matters to people, practice, research, or society.
        - Identify the disciplines, methods, partners, or technologies involved.
        - Add advanced detail, terminology, limitations, or references where useful.
      placement:
        title_and_description: General and understandable without specialist knowledge.
        opening_paragraph: General context plus the main specific point.
        later_sections: Technical, disciplinary, methodological, or policy detail for interested readers.
      rule: Do not simplify away important ideas; introduce them in an accessible order.
    use:
      - 'Prefer concrete subjects and verbs: "The project examines..." not "An examination is made...".'
      - Name the person, institution, place, or project doing the action.
      - Explain specialist terms briefly on first use.
      - Connect different disciplines without assuming that one field is the default.
      - Make relevance clear for artists, researchers, public and private partners, and the public.
      - Use Norwegian place names and institution names accurately.
      - Use dates, times, and locations that make sense to a Norwegian reader.
    avoid:
      - Passive voice when an active subject is known.
      - Hype, promotional claims, and vague AI-generated filler.
      - Repeating the same point in the title, summary, and opening paragraph.
      - Unexplained acronyms, generic introductions, and inflated adjectives.
  vocabulary:
    british_examples:
      - organisation
      - programme
      - centre
      - analyse
      - behaviour
      - travelling
    preferred_punctuation:
      - Use commas, colons, full stops, or parentheses instead of em dashes.
      - Use Markdown headings for structure, not bold text used as a heading.
  norwegian_focus:
    priority:
      - State the connection to Norway, a Norwegian institution, or the local context early.
      - Keep Norwegian names, diacritics, and official institution names intact.
      - Include Oslo or another relevant place when location matters.
      - Describe why the work matters to MishMash partners, researchers, artists, or audiences in Norway.
    do_not_assume:
      - Do not treat Norway as interchangeable with the wider Nordic region.
      - Do not translate official names unless an established English name exists.
  templates:
    active: "Researchers at the University of Oslo study how artists use AI in music."
    passive_to_active: '"The workshop is organised by UiO." -> "UiO organises the workshop."'
    concise: "The Oslo workshop brings artists and researchers together to test new creative tools."
  review_checks:
    - Confirm British spelling, including organisation, programme, centre, and analyse where applicable.
    - Search for Unicode U+2014 and replace it with suitable punctuation.
    - Search for inline bold Markdown and replace it with plain text or a heading.
    - Check that most sentences are 25 words or fewer.
    - Check that the main actor appears early and uses an active verb.
    - Check that the first description is understandable to a non-specialist reader.
    - Check that specialist detail follows general context rather than replacing it.
    - Check that the Norwegian connection is clear without overstating it.

languages_and_terminology:
  purpose: >-
    The site is written twice and generated a third time. English under site/ is
    the source, Bokmaal under site/no/ is written by hand beside it, and Nynorsk
    under /nn/ is produced from the Bokmaal pages at build time. An agent that
    edits one language and stops has introduced drift, which is treated as a
    failure here.
  rules:
    - Editing a page under site/ means editing its mirror under site/no/ in the
      same change, and the other way round. The two pages carry the same
      headings in the same order.
    - Never edit anything under site/nn-auto/. It is generated and git ignores
      it. Correct the Bokmaal page, or add a rule to the translation glossary.
    - A term the centre uses belongs in site/_data/glossary.yml, with its English,
      Bokmaal and Nynorsk form, so that the glossary pages, the inline
      stretchtext explanations and /data/terminology.json all say the same thing.
  terminology_record:
    file: site/_data/glossary.yml
    holds: >-
      One entry per term: term.en, term.nb and term.nn, a text at each reading
      level in English and Bokmaal, and optional references. The Nynorsk form is
      the reviewed one, and it is what the generated Nynorsk pages show instead
      of the Bokmaal term.
    published_as:
      - /about/glossary/ and /no/about/glossary/ and /nn/about/glossary/
      - /data/terminology.json and /data/terminology.csv, CC0, for reuse by others
    check: python3 scripts/check_terminology.py
  nynorsk_generation:
    script: python3 scripts/build_nynorsk.py
    engine: >-
      Apertium nob-nno followed by its e-infinitive variant. CI has Apertium
      installed and translates locally; a laptop without it goes through the
      public service at apertium.org with a cache in .nynorsk-cache/. The two
      fail differently on the same sentence, so a page can read correctly in a
      local build and wrongly as published. Read the published page.
    translation_glossary:
      file: site/_data/nynorsk_glossary.yml
      keep: Names and terms the translator must not touch.
      replace: >-
        Literal repairs applied to the translated text, for a fixed form the
        centre wants and for what the translator gets wrong by itself. Give a
        rule enough context to be safe ("Raa fraa", not "Raa").
      expected_unused: >-
        Rules that may legitimately match nothing: those aimed at the other back
        end, and safety nets for a term the translator currently gets right.
        Each one carries a comment saying why.
    check: python3 scripts/build_nynorsk.py --check-glossary
    reading_a_generated_page: >-
      After changing a Bokmaal page, regenerate and read site/nn-auto/<path>.
      Look for a present tense turned into an infinitive, a lost definite form,
      a wrong gender, and Markdown the translator has broken. Add a rule for
      what you find, rebuild, and grep for the new form to see what it touched.

repository:
  site_source: site/
  build_output: _site/
  timezone: Europe/Oslo
  generated_output_is_ignored: true
  never_edit_generated_output: true
  wiki_root: https://github.com/MishMash-Norway/mishmash-web/wiki
  human_guides:
    adding_news: https://github.com/MishMash-Norway/mishmash-web/wiki/Adding-News
    adding_events: https://github.com/MishMash-Norway/mishmash-web/wiki/Adding-Events
    directory: https://github.com/MishMash-Norway/mishmash-web/wiki/Directory
    scripts_and_automation: https://github.com/MishMash-Norway/mishmash-web/wiki/Scripts-and-Automation
    site_architecture: https://github.com/MishMash-Norway/mishmash-web/wiki/Site-Architecture
    local_build: https://github.com/MishMash-Norway/mishmash-web/wiki/Running-the-Site-Locally
    visual_identity: https://github.com/MishMash-Norway/mishmash-web/wiki/Visual-Identity-and-Theming

visual_identity:
  adopted: 2026-09-13
  guide: BRAND.md
  public_page: "/internal/brand/ (Norwegian: /no/internal/brand/)"
  tokens: site/assets/css/brand.css
  styling: site/assets/css/identity.css
  logo_files: site/assets/images/logo/
  tagline_keys: translations.yml identity_tagline (en/nb)
  placeholder_image: >-
    /assets/images/bubbles/mishmash_bubbles_notext.svg, the bubbles recoloured to the
    2026 palette; still the default image for news and events without a photograph.
  rules:
    - Use the --mm-* custom properties; never hard-code the superseded #A7A1F4, #C1F7AE or #363644.
    - Text on the pastel surfaces (green, purple, blue, pink) is always ink (#231f20).
    - Wordmark pairings are fixed: black on green, green on purple, yellow on blue, red on pink.
    - Fonts are self-hosted; never add Adobe Fonts, Google Fonts or another remote font service.
    - No gradients, drop shadows or rounded corners.
  theming:
    themes_dir: themes/
    guide: themes/README.md
    preview_url: https://mishmash.no/ui/<name>/
    gallery_registry: site/_data/ui_themes.yml
    swap_main_look: ./scripts/ui promote <name> --keep-as <old-name>
    swap_rule: >-
      site/ is the single source of truth for the live look. Promoting a theme snapshots
      the files it overrides into themes/<old-name>/, copies the theme into site/, and
      removes the theme folder. Merge the theme's _config.yml keys by hand.
    previous_look: "bubbles (themes/bubbles/, https://mishmash.no/ui/bubbles/)"

routing:
  - request_type: authored_news
    source: site/_news/YYYY-MM-DD-short-slug.md
    public_area: /news/{filename}/
  - request_type: authored_event
    source: site/_events/YYYY-MM-DD-short-slug.md
    public_area: /events/{slug}/
  - request_type: meshup_activity
    source: site/_events/YYYY-MM-DD-meshupNN.md
    public_area: /events/{slug}/
    special_rule: Add MeshUp to categories; add WP1 through WP7 when applicable.
  - request_type: partner_news
    source: site/_data/partner_news.yml
    public_area: /news/partner-news/
    special_rule: Add an external link record; do not create a local news page.
  - request_type: partner_event
    source: site/_data/partner_events.yml
    public_area: /events/partner-events/
    special_rule: Add an external link record; do not create a local event page.
  - request_type: directory_person
    source: site/_directory/people/{slug}/index.md
    public_area: /people/{slug}/
    special_rule: Start from site/_directory/people/_template/index.md.

content_types:
  authored_news:
    source_directory: site/_news/
    filename: YYYY-MM-DD-short-slug.md
    required_front_matter:
      title: double-quoted sentence-case headline
      date: YYYY-MM-DD
      layout: default
      description: one-sentence listing and link-preview summary
    recommended_front_matter:
      author: full name in double quotes
      categories: existing category such as Announcement, Vacancy, Publication, or Press
      image: /assets/images/bubbles/mishmash_bubbles_notext.svg or a relevant image
    body_rules:
      - Start with a self-contained opening paragraph.
      - Use ## for body headings; the title is supplied by front matter.
      - Use real alt text for Markdown images.
      - Put the main substance early because the first 100 words enter search indexing.
    appears_in:
      - front page
      - /news/
      - site search as type news
      - RSS and Atom feeds

  authored_event:
    source_directory: site/_events/
    filename: YYYY-MM-DD-short-slug.md
    required_front_matter:
      title: double-quoted title, especially when it contains a colon
      date: YYYY-MM-DD HH:MM:SS with Europe/Oslo timezone offset
      end_date: YYYY-MM-DD HH:MM:SS with timezone offset
      location: venue, Zoom, or both
      layout: event
      description: one-sentence listing and link-preview summary
    recommended_front_matter:
      categories: event type plus WP1 through WP7 when applicable
      tags: existing research topic tags only
      image: /assets/images/bubbles/mishmash_bubbles_notext.svg or a relevant image
      slug: lowercase ASCII hyphenated short URL slug
    rules:
      - Use +01:00 for Oslo winter time and +02:00 for Oslo summer time.
      - Put work packages in categories, never tags.
      - Put research topics in tags, never categories.
      - future_is_published_immediately: true
    appears_in:
      - front page
      - /events/
      - matching work package page when a WP category is present
      - /events/calendar.ics
      - event page Google Calendar link
      - site search as type event

  meshup_activity:
    inherits: authored_event
    source_directory: site/_events/
    filename_pattern: YYYY-MM-DD-meshupNN.md
    required_category: MeshUp
    optional_categories: [WP1, WP2, WP3, WP4, WP5, WP6, WP7]
    title_pattern: MeshUp #NN plus a descriptive title
    source_spreadsheet: temp/MishMash Meetups.xlsx
    practical_rule: Import schedule updates from the spreadsheet, then review the generated metadata and body.
    automation:
      preview: python3 scripts/import_meshups_from_xlsx.py --xlsx "temp/MishMash Meetups.xlsx"
      write: python3 scripts/import_meshups_from_xlsx.py --xlsx "temp/MishMash Meetups.xlsx" --write
      portrait: python3 scripts/import_meshups_from_xlsx.py --write --portrait NN=temp/Speaker_Name.jpeg
      archived_events: Add --include-past only when intentionally refreshing past MeshUps.
      default_scope: The importer updates events dated today or later only.
    consistency_checks:
      - date and end_date match the requested activity date and time
      - speaker names agree in title, description, and opening body text when repeated
      - placeholder text is removed when a speaker is known
      - relevant portrait or event image exists before referencing it

  partner_news:
    source_file: site/_data/partner_news.yml
    record_shape:
      date: YYYY-MM-DD
      lang: en or nb
      url: external canonical article URL
      title: display headline
      description: one-sentence summary
      partner: partner organisation
      og_image: optional absolute image URL
    rules:
      - Keep English and Norwegian versions as separate records when both exist.
      - Use the partner article URL, not a new local page.
      - Prefer existing partner naming and language conventions.
      - Check for an existing record with the same URL before adding one.
    automation: No dedicated partner-news fetcher was found; treat this file as hand-maintained data.

  partner_event:
    source_file: site/_data/partner_events.yml
    record_shape:
      start_date: YYYY-MM-DD
      end_date: YYYY-MM-DD
      url: external canonical event URL
      partner: partner organisation
      title: display title
      description: concise event summary with time and place when available
      og_title: optional scraped title
      og_description: optional scraped description
      og_image: optional absolute image URL
    rules:
      - Use date-only values unless the existing data format requires otherwise.
      - Check for an existing record with the same URL before adding one.
      - Keep the event external; do not create a duplicate file in site/_events/.
      - Confirm the event is future or current before adding it to the upcoming list.
    automation:
      metadata_refresh: python3 scripts/fetch_partner_og_data.py
      caveat: Partner events are entered by hand; the OG refresh only fills title, description and image.

  directory_person:
    source_directory: site/_directory/people/
    template: site/_directory/people/_template/index.md
    filename: '{slug}/index.md'
    required_front_matter:
      type: person
      slug: lowercase ASCII letters, digits, and hyphens
      permalink: /people/{slug}/
      name: full name
      title: display name or title
      roles: curated role list
      urls: nva or orcid URL recommended for synchronisation
    recommended_front_matter:
      position: role or position
      institution: primary institution slug
      institutions: institution slugs
      projects: project slugs
      wps: work package identifiers
      tags: 2 to 6 existing human-readable research tags
      summary: short profile summary
      image: site asset path when manually curated
    manual_fields_preserved_by_nightly_sync:
      - name
      - title
      - slug
      - roles
      - projects
      - source_mentions
      - social URLs
      - Markdown body
    fields_overwritten_when_urls_nva_is_set:
      - position
      - department
      - institution
      - institutions
      - nva_affiliations
      - tags
      - search_keywords
      - summary
      - selected_works
      - other_projects
      - urls.institutional_website
      - urls.nva
      - urls.orcid
      - image
    rules:
      - Copy the template; set slug, name, and at least urls.nva or urls.orcid when available.
      - Use slugs in people, institutions, and projects lists, not path-style URLs.
      - Keep cross-links reciprocal.
      - Do not commit NVA credentials.
      - >-
        Guest and visiting affiliations in NVA are not real affiliations. The enrich
        script ignores them and removes stale guest data (position, institution,
        nva_affiliations entry, and the person from the institution's people list).
        A guest-only person is left without institution and position; set the real
        employer by hand if known.
      - >-
        To add a person to a project, edit three places: the person's projects list,
        the project's people list, and the hand-written "## People" line in the project
        body. The institution page's people list is filled by the reciprocity sync.
      - >-
        After creating a profile, run the enrich script with --slug and without --dry-run
        so position, department, tags, works, and portrait are filled the same way the
        nightly workflow would.
    automation:
      enrich_one: python3 scripts/enrich_directory_from_nva.py --slug some-person --dry-run
      enrich_all: python3 scripts/enrich_directory_from_nva.py --discover-nva --discover-nva-loose --max-works 10
      discover_orcid_public: python3 scripts/discover_orcid_public_search.py --dry-run
      assign_wps_from_mailing_lists: python3 scripts/assign_wps_from_mailing_lists.py --dumps-dir temp --dry-run
      validate: python3 scripts/validate_directory.py
      fix_reciprocity: python3 scripts/sync_directory_reciprocity.py
      nightly_workflow: .github/workflows/enrich-directory-people.yml

automation:
  event_importers:
    meshups: python3 scripts/import_meshups_from_xlsx.py --xlsx "temp/MishMash Meetups.xlsx"
    rule: Treat imported files as drafts for editorial review; verify dates, timezone, title, image, and body.
  directory_importers:
    spreadsheet: python3 scripts/import_people_from_xlsx.py
    nettskjema_fetch: python3 scripts/fetch_nettskjema_export.py --import [--write]  (downloads the form's Excel report through the Nettskjema API; needs config/nettskjema-credentials.json, see config/README.md)
  generated_or_machine_updated:
    - _site/
    - site/_data/mishmash_results.yml
    - many synced fields in site/_directory/people/
    - portraits downloaded by the NVA enrichment script
  credentials:
    location: config/
    rule: Never commit credential files or secrets.

validation:
  always:
    - git diff --check
    - inspect git diff for unintended files and conflict markers
  content_data:
    - >-
      ruby -e "require 'yaml'; YAML.safe_load(File.read('site/_data/partner_events.yml'), aliases: true); YAML.safe_load(File.read('site/_data/partner_news.yml'), aliases: true)"
  directory_if_touched:
    - python3 scripts/validate_directory.py
  accessibility_if_touched:
    note: >-
      An audit by the UiO web team on 24 September 2026 found six failures that
      the page scan could not see, because each needs a state a reader has to
      bring about. Run these when changing colours, a listing card, an event
      picture or the header menus.
    commands:
      - node scripts/check_contrast.mjs
      - python3 scripts/check_event_alt.py
      - npx playwright test -c tests/visual/playwright.config.js tests/visual/menus.spec.js
    rules:
      - Text needs 4.5:1 against what is painted behind it, 3:1 when it is large.
        The identity purple is a surface colour; text uses --mm-purple-text.
      - An event whose picture shows a person carries image_alt in its front
        matter, naming them as the directory or the page itself does. Never
        invent a name, and never let the alternative text fall back to the
        event's location.
      - A listing card links to its destination once. A thumbnail that repeats
        the title link carries tabindex="-1", aria-hidden="true" and an empty alt.
      - Anything that opens on pointer or focus closes on Escape, and gives the
        focus back to what opened it.
      - A page that introduces an abbreviation adds it to site/_data/abbreviations.yml
        with its expansion in English, Bokmaal and Nynorsk. The "about this page"
        panel lists the ones found on each page, at build time, with no script.
      - Every page but the front pages carries a breadcrumb trail drawn from its
        address (_includes/breadcrumbs.html). A page switches it off by setting
        breadcrumbs to false in its front matter.
      - A page with reading levels wraps each prose section in
        div.adaptive blocks with data-for naming the level (simple, standard or
        advanced) and sets adaptive to true. check_readability.py --strict fails
        when a section covers some levels but not all. WP1 is the model.
    opening_ceremony_transcript: >-
      The text alternative to the opening ceremony recording (1.2.8) is built by
      scripts/build_opening_transcript.py from the caption files in the archive
      folder of the recording, one part per programme item, in the language
      each part was spoken in. It writes site/events/aulaen2026-transcript/ and
      the site/no/ mirror with published set to false. Publishing is a decision
      for a person who has read the text against the recording; when taken,
      remove that line and link the pages from the event page and the lab page.
    wcag_aaa: >-
      The main site is measured against AAA as a report only:
      node scripts/measure_aaa.mjs. A theme that declares wcag_target: AAA in
      its _config.yml is measured with --fail in the theme job and has to reach
      it. The purple surface stays as it is on the main site by decision; test
      it in a theme. Figures and open items are on issue #76.

  terminology_if_touched:
    - python3 scripts/check_terminology.py
    - python3 scripts/build_nynorsk.py --check-glossary
  language_mirrors_if_touched:
    - Confirm the English page and its site/no/ mirror carry the same headings.
    - Read the regenerated page under site/nn-auto/ before pushing.
  site_build:
    - bundle exec jekyll build --trace
    - bundle exec htmlproofer ./_site --disable-external --no-enforce-https
    - html5validator --root _site --log WARNING
  optional_accessibility:
    - python3 -m http.server 4000 --directory _site
    - npx --yes wait-on@7 http://127.0.0.1:4000/
    - npx --yes pa11y-ci@3 --config .pa11yci.json
  final_review:
    - Confirm the entry appears in the intended upcoming or past listing.
    - Confirm event dates, timezone, partner, speaker names, and external URLs.
    - Confirm images load and have meaningful alt text where applicable.
    - Confirm generated _site output was not added to the change.

build_and_ci:
  purpose: >-
    How to reproduce the GitHub checks locally and how to read a failed build,
    so that a red workflow can be diagnosed in minutes rather than by guessing.
    The wiki page When-Things-Go-Wrong explains the same failures for a human reader.
  run_from_repository_root:
    rule: Run every bundle, python3, and html5validator command from the repository root.
    why: >-
      The Jekyll config and Gemfile live at the root; _config.yml sets source: site and
      destination: _site. Running from site/ fails with a Ruby stack trace and no useful
      message, and html5validator --root site/_site reports "There are no files to check"
      and exits 0, which looks like a pass but checked nothing.
  reading_a_failed_build:
    - Do not judge a build by its last three lines; the tail of a failure is the Ruby stack, not the cause.
    - 'Find the first real message: bundle exec jekyll build --trace 2>&1 | grep -n -m3 -iE "error|exception|yaml|conflict"'
    - A "Liquid Exception" or YAML message names the offending source file; open that file, not the layout.
    - 'For a workflow run: gh run view <run-id> --log-failed | tail -80, then scroll up from the ##[error] line.'
  local_ci_sequence:
    note: Mirrors the blocking jobs in .github/workflows/web-tests.yml, in order.
    steps:
      - python3 scripts/validate_directory.py
      - 'for t in scripts/test_*.py; do [ "$t" = scripts/test_nva_api_auth.py ] && continue; python3 "$t" || break; done'
      - bundle exec jekyll build --trace
      - bundle exec htmlproofer ./_site --disable-external --no-enforce-https
      - html5validator --root _site --log WARNING
    expected_success_signals:
      - 'validate_directory prints "OK: all checks passed." (warnings about tag counts are informational)'
      - 'jekyll prints "done in N seconds"'
      - 'htmlproofer prints "HTML-Proofer finished successfully."'
      - html5validator prints nothing and exits 0
    spot_check: 'grep the built page in _site/ for the change, e.g. grep -o "sets goals" _site/projects/<slug>/index.html'
  github_workflows:
    pages: .github/workflows/pages.yml builds and deploys the site on every push to main.
    web_tests: >-
      .github/workflows/web-tests.yml runs directory validation, script unit tests,
      the build, htmlproofer, the Nu HTML validator, and non-blocking audits.
    enrich: >-
      .github/workflows/enrich-directory-people.yml runs daily, syncs people and results
      from NVA and ORCID, and pushes directly to main.
    inspect:
      list_runs: gh run list --workflow <workflow-file> --limit 5
      failed_log: gh run view <run-id> --log-failed | tail -80
      rerun_enrich: gh workflow run enrich-directory-people.yml
      after_push: Watch both pages and web-tests for the new commit before reporting success.
  known_failures:
    enrich_push_guard:
      symptom: 'Enrich job fails at "Commit and push updates" with "Refusing to push files outside the approved paths."'
      cause: >-
        The guard only allows changes under site/_directory, site/_data, site/_events,
        site/assets/images/portraits, and site/assets/images/bubbles/daily. Anything
        else the scripts touch, or a path git prints in quotes, is rejected.
      history: >-
        On 2026-09-08 a portrait named with the HiØF short name was rejected because git
        quotes non-ASCII paths; fixed in commit 781f039f by disabling core.quotePath in
        the guard. Paths containing spaces are still quoted and still rejected by design.
      fix: Make the scripts write only under the approved paths, or extend the allowlist in the workflow deliberately.
    nu_html_validator:
      symptom: 'The "Validate HTML" job fails while the local build and htmlproofer pass.'
      common_causes:
        - an empty <details> element
        - a <style> block inside page body content
        - an <iframe> inside an <a>
        - raw HTML in Markdown with an unclosed tag
      fix: Run html5validator --root _site --log WARNING locally; it prints file and line.
    yaml_front_matter:
      symptom: Jekyll build fails mentioning YAML, Psych, or "did not find expected key".
      common_causes:
        - an unquoted title containing a colon
        - tabs used for indentation
        - a smart quote pasted from a word processor
        - a missing closing --- line
    directory_validation:
      symptom: validate_directory reports an error naming a slug.
      fix: >-
        Check that every slug referenced in people, institutions, and projects lists
        exists and that the link is reciprocal; python3 scripts/sync_directory_reciprocity.py
        repairs most reciprocity gaps.

agent_workflow:
  - Read this file first and classify the request using routing.
  - Inspect one nearby existing entry before editing.
  - Check for duplicate URL, slug, or person before creating a new record.
  - Make the smallest source-only change.
  - Run the narrowest relevant validation, then the site build when practical, from the repository root.
  - If a check or workflow fails, follow build_and_ci before changing anything else.
  - Mirror every content edit into the other language, and read the generated Nynorsk page.
  - Report source files changed, automation side effects, and checks run.
