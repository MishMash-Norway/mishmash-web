# Curated gallery entries shown at /gallery/ (and /no/gallery/), in order.
# Artistic results registered in NVA (exhibitions, performances) are added
# to the page automatically — this file is for artistic work that deserves a
# spot in the overview and is not in NVA.
#
# The site's own experiments and pieces live in the lab (/lab/) rather than
# here: the bubbles, the daily artwork, the soundscape, the people network,
# the heritage viewer and the semantic search. Interface themes have their
# own gallery at /ui/.
#
# Fields: title, url, kind/kind_nb (short type label), byline (who/where),
# description/description_nb, year (optional), external (true opens in a
# new tab).
