# Abbreviations used on the site, with their expanded form in each language.
#
# The "about this page" panel (_includes/page-about.html) lists the ones that
# occur on the page being read, so a reader can find the expansion without
# leaving the page. That is the mechanism WCAG 3.1.4 Abbreviations (AAA) asks
# for, and it needs no JavaScript: the include tests page.content for each
# abbreviation at build time. Keep this list to abbreviations that cannot be
# mistaken for part of another word in capitals; "WP" on its own and "OF" are
# left out for that reason.
#
# nn is written by hand here, because this file is not run through the
# Nynorsk generator. Proper names keep their form in every language.
#
#   term  the abbreviation exactly as it appears in the text
#   en/nb/nn  the expansion. A proper name may repeat across languages.

