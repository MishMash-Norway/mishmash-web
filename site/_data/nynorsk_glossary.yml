# Glossary for the automatic Bokmål to Nynorsk translation (scripts/build_nynorsk.py).
# keep: words and names the translator must pass through untouched.
# replace: substitutions applied to the Nynorsk output, for terms the centre wants
#          in one fixed form. Left side is what the translator produces, right side
#          is what the site should say.
keep:
  - MishMash
  - MeshUp
  - MeshUps
  - Kilden
  - Kunstsilo
  - Kraftverk
  - Freesound
  - Wikidata
  - Wikipedia
  - GitHub
  - JavaScript
  - Pa11y
  - Lighthouse
  - NVA
  - ORCID
  - WCAG
  - Zoom
  - rosa
  - Rosa
replace:
  # "KI" is protected as an acronym, so the translator sees "Senter for" as a
  # chunk on its own and the e-infinitive pass misreads the dangling "for" as
  # the verb "fór".
  "Senter fór KI": "Senter for KI"
  "senter fór KI": "senter for KI"
  "Forskningsrådet": "Forskingsrådet"
  # The translator drops the "d" of "Råd" when the word opens a table cell, and
  # leaves "Overordnede" and a bare "Ukentlig" half-translated.
  "Rå frå": "Råd frå"
  "Rå om": "Råd om"
  "Rå til": "Råd til"
  "Overordn avgjerder": "Overordna avgjerder"
  "ad hoc-møter": "ad hoc-møte"
  "| Ukentlig |": "| Kvar veke |"
  # "forventes å følge" comes back as "er vente" or "er forventa"; the centre
  # says it plainly.
  "er vente å følgje": "skal følgje"
  "er forventa å følgje": "skal følgje"
  # The e-infinitive pass turns some present-tense verbs into infinitives, drops
  # the definite form after "Kvar", and gets the gender of "eit møte" wrong.
  "og gå ut frå at": "og går ut frå at"
  "som peike ut folk": "som peikar ut folk"
  "Kvar grense går": "Kvar grensa går"
  "blir teken opp": "blir teke opp"
