# Glossary for the automatic Bokmål to Nynorsk translation (scripts/build_nynorsk.py).
# keep: words and names the translator must pass through untouched.
# replace: substitutions applied to the Nynorsk output, for terms the centre wants
#          in one fixed form. Left side is what the translator produces, right side
#          is what the site should say.
keep:
  - MishMash
  - MeshUp
  - MeshUps
  - Kilden
  - Kunstsilo
  - Kraftverk
  - Freesound
  - Wikidata
  - Wikipedia
  - GitHub
  - JavaScript
  - Pa11y
  - Lighthouse
  - NVA
  - ORCID
  - WCAG
  - Zoom
  - rosa
  - Rosa
replace:
  # "KI" is protected as an acronym, so the translator sees "Senter for" as a
  # chunk on its own and the e-infinitive pass misreads the dangling "for" as
  # the verb "fór".
  "Senter fór KI": "Senter for KI"
  "senter fór KI": "senter for KI"
  "Forskningsrådet": "Forskingsrådet"
  # The translator drops the "d" of "Råd" when the word opens a table cell, and
  # leaves "Overordnede" and a bare "Ukentlig" half-translated.
  "Rå frå": "Råd frå"
  "Rå om": "Råd om"
  "Overordn avgjerder": "Overordna avgjerder"
  "ad hoc-møter": "ad hoc-møte"
  "| Ukentlig |": "| Kvar veke |"
  # "forventes å følge" comes back as "er vente" or "er forventa"; the centre
  # says it plainly.
  "er vente å følgje": "skal følgje"
  "er forventa å følgje": "skal følgje"
  # The e-infinitive pass turns some present-tense verbs into infinitives, drops
  # the definite form after "Kvar", and gets the gender of "eit møte" wrong.
  "og gå ut frå at": "og går ut frå at"
  # More of the same: a lost plural in "like vilkår", "best" read as "god", the
  # Vi/Me split, and two words left in Bokmål.
  "på lik vilkår": "på like vilkår"
  "Me vel ": "Vi vel "
  "komme til orda": "komme til orde"
  # A genitive turned into a place, and one more present tense read as an
  # infinitive.
  "ambisjonane på senteret": "ambisjonane til senteret"
  "som passe til": "som passar til"
  # The AI colophon: present tenses read as infinitives, a past participle left
  # as an infinitive, "data" read as the English "date", a genitive turned
  # around, and the gender of "eit skript" and "nettstaden".
  "og tilpassa tekstar": "og tilpasse tekstar"
  "redaktørar gå gjennom": "redaktørar går gjennom"
  "hentar date frå": "hentar data frå"
  "blir teikne på nytt": "blir teikna på nytt"
  "[liten skript]": "[lite skript]"
  "bilete teikne av ein skript": "bilete teikna av eit skript"
  "ikkje maskinenes": "ikkje maskinane sine"
  "ein del av MishMash forskingspraksisen sin": "ein del av forskingspraksisen til MishMash"
  "skap, utforska og reflektere": "skape, utforske og reflektere"
  "korleis det blir teikne opp og blir servert": "korleis han blir teikna opp og servert"
  "Vekt til nettstaden": "Vekta til nettstaden"
  "ned til teikne nettstaden": "ned til teikna nettstaden"
  "blir merke med ein boks": "blir merka med ein boks"
  "problem og retta dei": "problem og rette dei"
  "verktøya eller sidan.": "verktøya eller sida."
  # CI translates with a local Apertium and a laptop through the public service,
  # and the two fail differently on the same sentence. These are the local
  # engine's versions, seen on the published pages.
  "KI-modell er involverte": "KI-modell er involvert"
  "i metadataene": "i metadataa"
  "skapa, utforska og reflektere": "skape, utforske og reflektere"
  "blir førte tilbake": "blir ført tilbake"
  "korleis det blir teikna opp og blir servert": "korleis han blir teikna opp og servert"
  "nettstaden er skrive med": "nettstaden er skriven med"
  "har bli til": "har vorte til"
  "arbeidstida kvarandres, pausar og feriar": "arbeidstida, pausane og feriane til kvarandre"
  # Found by reading the other generated pages after the same rules were added.
  "har gå gjennom": "har gått gjennom"
  "respekterer kvarandres arbeidstid, pausar og feriar": "respekterer arbeidstida, pausane og feriane til kvarandre"
  "som ta i bruk": "som tek i bruk"

# Replacement rules that may match nothing in a given run, with the reason.
# The build reports every rule that did no work, and fails on any rule not
# listed here when run with --check-glossary. Two causes are legitimate: CI
# translates with a local Apertium while a laptop goes through the public
# service, and the two fail differently on the same sentence; and a rule kept
# as a safety net for a term the translator currently gets right on its own.
expected_unused:
  # The public service gets this one right by itself; kept because the name matters.
  - "Forskningsrådet"
  # The local Apertium's versions of sentences the public service breaks differently.
  - "er forventa å følgje"
  - "Me vel "
  - "KI-modell er involverte"
  - "i metadataene"
  - "skapa, utforska og reflektere"
  - "blir førte tilbake"
  - "korleis det blir teikna opp og blir servert"
  - "nettstaden er skrive med"
  - "har bli til"
  - "arbeidstida kvarandres, pausar og feriar"
