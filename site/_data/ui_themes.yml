# UI themes listed on the /ui/ preview gallery. Each name must match a
# folder under themes/ — the deploy workflow builds every theme it finds
# into /ui/<name>/, and this file controls what the gallery says about them.
- name: example
  title: Example
  description: >-
    A minimal demonstration theme showing the two basic moves: an extra
    stylesheet layered on the regular site, and a badge showing which theme
    is active.
- name: techy
  title: Techy
  description: >-
    A dark, terminal-inspired UI in a page-wide two-column layout: sticky
    sidebar with tree-style menus, monospace type, neon green/cyan accents.
- name: sfa
  title: SFA
  description: >-
    A light experimental interface with a live p5.js Game of Life background,
    mild reload-to-reload palette shifts, and a WebAudio granular engine that
    reshapes Freesound material into dense audio-reactive textures.
- name: bubbles
  title: Bubbles
  description: >-
    The look of mishmash.no from launch until September 2026: gradient
    header, the two overlapping bubbles as logo and front-page illustration,
    and the original purple/green palette in thumbnails, icons and figures.
