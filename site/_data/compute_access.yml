institutions:

  # Norwegian universities with their own cluster and gateway
  university-of-oslo:
    category: no-university-full
    local:
      services:
        - name: GPT UiO
          note: >-
            Chat and API, open-weight models served on UiO and NTNU hardware
            alongside commercial ones, quotas per model per month, separate API
            keys for yellow and red data. Approved for red (confidential) data
            on some models since 2026.
          url: https://www.uio.no/tjenester/it/ki/gpt-uio/
        - name: Autotekst
          note: Speech to text and video subtitling, on UiO servers.
          url: https://www.uio.no/english/services/it/video-sound/autotekst/
        - name: Fox and Educloud Research
          note: Cluster with GPU nodes, plus a browser desktop and notebooks.
          url: https://www.uio.no/english/services/it/research/hpc/fox/
        - name: TSD
          note: Secure environment for confidential and health data, with Autotekst inside it.
          url: https://www.uio.no/tjenester/it/forskning/sensitiv/
  norwegian-university-of-science-and-technology:
    category: no-university-full
    local:
      services:
        - name: GPT NTNU
          note: >-
            Chat over models served locally, developed with UiO and running on
            infrastructure at both institutions.
          url: https://gpt.ntnu.no/en
        - name: Idun
          note: NTNU's GPU cluster, which also hosts models for the gateway.
          url: https://www.hpc.ntnu.no/idun/
        - name: HUNT Cloud
          note: Secure environment for sensitive data.
          url: https://www.ntnu.edu/mh/huntcloud
  university-of-bergen:
    category: no-university-full
    local:
      services:
        - name: UiBchat
          note: Chat service for UiB students and staff.
          url: https://ntk.app.uib.no/TJ0838/
        - name: SAFE
          note: >-
            Secure environment for sensitive personal data, open to UiB staff,
            students and external collaborators, with computing inside it.
          url: https://hjelpekort.app.uib.no/KI-0308.html

  # Norwegian universities and colleges without their own cluster
  arctic-university-of-norway:
    category: no-university-no-cluster
    local:
      note: >-
        UiT has no cluster of its own, but its HPC group runs the national
        systems and can help with a national allocation.
      services:
        - name: UiT HPC group
          note: >-
            Email, weekly office hours and monthly question sessions, for
            researchers who need more than a personal computer.
          url: https://hpc.uit.no/
  university-of-agder:
    category: no-university-no-cluster
    local:
      note: >-
        UiA runs no gateway or general cluster of its own. CAIR, the Centre
        for Artificial Intelligence Research, has its own machines, but their
        terms are a question for CAIR rather than an institutional service.
      services:
        - name: GPT UiO
          note: Staff and students, Feide login at gpt.uio.no, yellow data.
          url: https://www.uia.no/uia-hjelp/it/ai.html
        - name: Copilot
          note: Staff and students, UiA Microsoft account, yellow data.
          url: https://www.uia.no/uia-hjelp/it/ai.html
  university-of-stavanger:
    category: no-university-no-cluster
  university-of-inland-norway:
    category: no-university-no-cluster
    local:
      services:
        - name: Sikt KI, GPT UiO and Copilot
          note: All three are available to INN staff and students.
          url: https://www.inn.no/om-universitetet/kunstig-intelligens/
        - name: Autotekst
          note: Transcription and subtitling, through UiO.
          url: https://www.inn.no/it-brukerstotte/
  oslo-metropolitan-university:
    category: no-university-no-cluster
  nord-university:
    category: no-university-no-cluster
  western-norway-university-of-applied-sciences:
    category: no-university-no-cluster
  ostfold-university-college:
    category: no-university-no-cluster
  kristiania-university-college:
    category: no-university-no-cluster
  nla-university-college:
    category: no-university-no-cluster
  bi-norwegian-business-school:
    category: no-university-no-cluster

  # Norwegian arts education
  norwegian-academy-of-music:
    category: no-arts-education
  oslo-national-academy-of-the-arts:
    category: no-arts-education
  oslo-school-of-architecture-and-design:
    category: no-arts-education
  barratt-due-institute-of-music:
    category: no-arts-education

  # Norwegian cultural institutions
  national-library-of-norway:
    category: no-cultural-institution
    local:
      note: >-
        The National Library is the exception in this category. It runs its
        own AI lab, publishes models and datasets openly, and has state funding
        for Norwegian and Sami language models, with matching computing money
        at Sigma2. It is part of Spraakmodellklynge Norge with UiO and NTNU.
      services:
        - name: AI-lab at the National Library
          note: Open models and datasets, including NB-Whisper and the Borealis models.
          url: https://ai.nb.no/
  norwegian-museum-of-cultural-history:
