# Where MishMash partners can get computing power for AI work.
#
# Two parts. `categories` carries the guidance, and is what almost every
# institution gets. `institutions` maps each directory slug to a category,
# with an optional `local` block for the few institutions whose own services
# have been checked against a public page.
#
# Rule for editing: do not add a `local` block unless you have checked it
# against the institution's own pages, and put the date in `last_checked`.
# A wrong local answer is worse than the category answer.

last_checked: 2026-11-06

# The centre's own projects, open to members whatever their institution.
# Project numbers and allocation sizes stay off the page.
centre_projects:
  intro: >-
    MishMash has its own projects on Educloud Research at the University of
    Oslo and on Sigma2's national systems. Members can be added to them, which
    is often the quickest way to get started. Write to contact@mishmash.no and
    say which you need and what for.
  outside_norway: >-
    Members at partners outside Norway can also be added, if they can log in
    through ID-porten with their national electronic ID (eIDAS).
  services:
    - name: Educloud Research
      note: >-
        Windows and Linux desktops, shared storage and the Fox cluster with
        GPU nodes, with notebooks and graphical applications in the browser.
        Approved for data up to red (confidential).
      url: https://www.uio.no/english/services/it/research/platforms/edu-research/
    - name: Sigma2
      note: >-
        The national computing and storage systems, for training and other
        work too large for a workstation or a local cluster.
      url: https://www.sigma2.no/

# Shown on every panel, because it is true everywhere.
universal_note: >-
  No Norwegian institutional service runs models for image, sound, music or
  video; the gateways listed here handle text and speech only. For these media,
  use open-weight models on hardware you control.

categories:

  no-university-full:
    label: Norwegian university with its own cluster and gateway
    covers: >-
      Large Norwegian universities with their own chat gateway, computing
      cluster and secure environment for confidential data.
    start_here: >-
      Ask your IT service before applying for anything national, since much of
      what you need is likely to exist at your own institution.
    chat: >-
      Your institution runs a gateway with a chat interface and an API, serving
      open-weight models on Norwegian hardware alongside commercial ones. Each
      model is marked with the data classification it may carry, so check how
      your material is classified before using it.
    transcription: >-
      Autotekst from UiO transcribes speech and subtitles video on Norwegian
      servers, and is used by many institutions. A version inside the secure
      environment handles confidential and health material.
    fine_tuning: >-
      Use your own cluster first. It is easier to get onto than the national
      systems, and the queues are shorter.
    national: >-
      You are eligible. A project leader in a permanent, postdoctoral or
      temporary position applies; students apply through a supervisor. There
      are two calls a year, with deadlines usually in February and August, and
      requests outside the calls are normally answered within a few working
      days.
    european: >-
      Free for publicly funded research through EuroHPC AI for Science and the
      LUMI AI Factory, which Norway is part of.
    ask: Your IT service or research support office.

  no-university-no-cluster:
    label: Norwegian university or university college without its own cluster
    covers: >-
      Norwegian higher education institutions that offer a chat service but
      run no computing cluster of their own.
    start_here: >-
      Eligibility for the national systems follows the type of institution,
      not whether it owns hardware. You can hold a national allocation without
      a local cluster.
    chat: >-
      At least one of Sikt KI, GPT UiO or Microsoft Copilot, through Feide or
      your institutional account. Ask your IT service which, and for which data
      classifications.
    transcription: >-
      Autotekst from UiO is available at many institutions. If yours does not
      have it, ask your IT service to buy access.
    fine_tuning: >-
      The national systems, since there is no local cluster. A department
      workstation with one good GPU also covers a lot and needs no application.
    national: >-
      You are eligible. Ask whether a colleague already has an allocation you can join, which is
      faster than starting a new one.
    european: >-
      Free for publicly funded research through EuroHPC AI for Science and the
      LUMI AI Factory, which Norway is part of.
    ask: Your IT service, then Sigma2 at contact@sigma2.no.

  no-arts-education:
    label: Norwegian art academy or conservatoire
    covers: >-
      Norwegian higher education institutions in music, art, design and
      architecture.
    start_here: >-
      The national systems are open to you on the same terms as to any
      university.
    chat: >-
      Whatever your institution has bought, usually Sikt KI or GPT UiO through
      Feide. These handle text and speech, not sound or image.
    transcription: >-
      Autotekst, if your institution has it. If not, ask for it.
    fine_tuning: >-
      Training a model on your own recordings, video or drawings takes a GPU
      for hours or days. One workstation in the building is often enough, and
      a national allocation covers the rest.
    national: >-
      You are eligible as a Norwegian university college. The project leader
      must hold a position; students apply through a supervisor. As far as we
      know, nobody at a Norwegian arts institution has yet used the national
      systems for sound, image or video, and MishMash can help with a first
      application.
    european: >-
      Free for publicly funded research through EuroHPC. If you work with an
      artist-run company, the free routes for small and medium enterprises may
      also apply.
    ask: >-
      Your IT service, and contact@mishmash.no for help with a first
      application.

  no-cultural-institution:
    label: Norwegian cultural institution, museum, festival or centre
    covers: >-
      Museums, libraries, archives, festivals, concert houses, production
      centres and arts organisations in Norway.
    start_here: >-
      There are two possible routes, described below. If you try one, tell us
      how it went.
    chat: >-
      Commercial services, unless your institution has bought something. There
      is no national AI service for the cultural sector.
    transcription: >-
      Commercial services, or Whisper run locally, which is free, keeps the
      material private and runs on an ordinary laptop.
    fine_tuning: >-
      In practice, your own hardware. A workstation with a good GPU covers most
      needs.
    national: >-
      KI-fabrikken at Sigma2 serves the public sector, and a publicly owned or
      publicly funded institution may qualify. Sigma2 also asks organisations
      outside its listed categories to get in touch. As far as we know, no
      Norwegian museum, theatre or festival has tried either.
    european: >-
      Generally not open, unless you have a company that counts as a small or
      medium enterprise.
    ask: >-
      Sigma2 at contact@sigma2.no, and tell us what they answer at
      contact@mishmash.no.

  no-research-institute:
    label: Norwegian research institute
    covers: >-
      Independent Norwegian research institutes and their subsidiaries.
    start_here: >-
      You are eligible for the national systems, and many institutes already
      have allocations. Check internally before applying.
    chat: >-
      Whatever your institute has bought. Several use the university gateways
      under agreement.
    transcription: >-
      Autotekst, where your institute has access. Otherwise Whisper run locally
      or a commercial service.
    fine_tuning: >-
      Institute hardware first, then the national systems.
    national: >-
      Governmental research centres and bodies funded by the Ministry of
      Education and Research or the Research Council are eligible. The project
      leader must hold a position at the institute.
    european: >-
      Free for publicly funded research through EuroHPC AI for Science.
      Projects funded by Horizon Europe or the Digital Europe Programme also
      qualify.
    ask: Your institute's research support, then contact@sigma2.no.

  no-company:
    label: Norwegian company or small enterprise
    covers: >-
      Norwegian companies, studios and startups in the partnership, including
      artist-run companies.
    start_here: >-
      Start with the European route, which is free.
    chat: >-
      Commercial services.
    transcription: >-
      Commercial services, or Whisper run locally when the material cannot
      leave the building.
    fine_tuning: >-
      Your own hardware for continuous use. As a rule of thumb, about six
      months of rented cloud capacity costs as much as the equivalent machine.
    national: >-
      Companies are eligible for the national systems, but pay for use.
      KI-fabrikken at Sigma2 is set up to serve Norwegian businesses.
    european: >-
      EuroHPC AI Factory access is free for AI-focused small and medium
      enterprises, including startups. Playground access is always open and
      normally decided within two working days. Fast Lane gives up to 50,000
      GPU hours and is normally decided within four. Norwegian companies
      qualify through the LUMI AI Factory. Apply at
      access.eurohpc-ju.europa.eu.
    ask: >-
      Sigma2 at contact@sigma2.no for the national route, and the EuroHPC
      access portal for the European one.

